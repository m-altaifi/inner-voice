[package]
name = "inner-voice"
version = "0.1.0"
edition = "2024"
# The highest rust-version in the dependency tree (eframe/egui), not
# edition 2024's own 1.85 -- an older toolchain otherwise fails deep in
# a dependency instead of saying what to install.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossbeam-channel = "0.5.16"
csv = "1.4.0"
dotenvy = "0.15.7"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts"] }
hound = "3.5.1"
knf-rs = "0.3.2"
ort = "2.0.0-rc.13"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
raw-window-handle = "0.6.2"
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
wasapi = "0.24.0"
whisper-rs = { version = "0.16.0", features = ["cuda"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Media_Speech", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections"] }
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

